spring:
  application:
    name: ai-interview-coach
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-before-use-1234567890}
    expiration: ${JWT_EXPIRATION:3600000}
  ai:
    provider: ${AI_PROVIDER:groq}
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    timeout: ${GROQ_TIMEOUT:20s}
